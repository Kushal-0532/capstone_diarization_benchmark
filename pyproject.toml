[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-diarization-benchmark"
version = "0.1.0"
description = "DER/RTF/memory benchmark: pyannote.audio 3.1 vs Gemma 4 (E2B/E4B/12B) speaker diarization"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Baseline system under test. 3.1.1 is the last 3.1.x; pinned exactly per C6/OQ5 —
    # upstream 4.x renamed use_auth_token->token and returns DiarizeOutput, not Annotation.
    "pyannote.audio==3.1.1",
    "pyannote.metrics==3.2.1",
    "pyannote.core==5.0.0",
    # Gemma 4 audio input needs transformers 5.x (AutoModelForMultimodalLM).
    "transformers==5.14.1",
    "accelerate==1.14.0",
    # torch/torchaudio are NOT exact-pinned: Colab ships a CUDA-matched build and reinstalling
    # it costs minutes and can break CUDA. env.describe() records the version that actually ran.
    "torch>=2.6",
    "torchaudio>=2.6",
    "librosa==0.11.0",
    "soundfile==0.14.0",
    "scipy==1.16.3",
    "pandas==2.3.3",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    # not pinned: transformers 5.x requires hub >=1.5, pyannote 3.1.1 only floors it at 0.13
    "huggingface-hub",
    "psutil==7.1.3",
]

[project.optional-dependencies]
# Local prototyping: run the same notebook here instead of round-tripping through Colab.
# Unpinned on purpose: dev tooling never touches a reported number, so C6 does not apply.
dev = ["jupyterlab", "ipykernel", "nbclient"]
# 4-bit NF4 for the 12B variant on a T4 (OQ3). Linux+CUDA only, hence not a core dep.
quant = ["bitsandbytes==0.50.0"]

[tool.setuptools.packages.find]
include = ["benchmark*"]
